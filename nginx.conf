# www -> apex. n8n solo permite el origen https://topcoatmedia.com en CORS,
# así que un lead que llegara por www.topcoatmedia.com veía la pantalla de
# éxito pero su envío quedaba bloqueado por el navegador y nunca llegaba.
server {
    listen 80;
    server_name www.topcoatmedia.com;
    return 301 https://topcoatmedia.com$request_uri;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /contact-form {
        try_files /contact-form.html =404;
    }

    location = /vsl {
        try_files /vsl.html =404;
    }

    location = /agenda {
        try_files /agenda.html =404;
    }

    location = /thank-you {
        try_files /thank-you.html =404;
    }

    location = /testimonials {
        try_files /testimonials.html =404;
    }

    location = /testimonios {
        try_files /testimonials.html =404;
    }

    location = /privacy-policy {
        try_files /privacy-policy.html =404;
    }

    location = /tos {
        try_files /tos.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
